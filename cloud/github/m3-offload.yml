name: M3 processing
run-name: '${{ inputs.task }} / ${{ inputs.dataset }} / ${{ inputs.source_sha }}'
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit in Ajuntanaga/polyphonic-audio-to-midi
        required: true
        type: string
      task:
        description: Bounded research task
        type: choice
        options: [assignment-trace, allocation-trace, core-check, timing-diagnosis, corpus-recovery, controlled-recovery, controlled-timing-diagnosis, controlled-stage-diagnosis, partial-identity]
        default: assignment-trace
      dataset:
        description: Recording for assignment trace or paired core/timing check
        type: choice
        options: [physical-middle, physical-highmid, physical-high, physical-long]
        default: physical-middle
      note:
        description: MIDI note for assignment trace
        type: number
        default: 52
      control:
        description: Retained pair for controlled timing diagnosis
        type: choice
        options: [octave_0dB, octave_-12dB]
        default: octave_0dB
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  # Keep the existing group so work started before public visibility stays serialized.
  group: m3-private-processing
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  TASK: ${{ inputs.task }}
  DATASET: ${{ inputs.dataset }}
  NOTE: ${{ inputs.note }}
  TIMING_CONTROL: ${{ inputs.control }}
  INPUT_TAG: corpus-20261108
  INPUT_SHA256: adf6e36f2883538cfa3b0500ca0d936ed64fc6a1e12aeae3bd89e40dbf7c4254
jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.task == 'corpus-recovery' && 210 || 60 }}
    steps:
      - name: Verify public destination and source selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = Ajuntanaga/m3-offload
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = false
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TASK" = assignment-trace || "$TASK" = allocation-trace || "$TASK" = core-check || "$TASK" = timing-diagnosis || "$TASK" = corpus-recovery || "$TASK" = controlled-recovery || "$TASK" = controlled-timing-diagnosis || "$TASK" = controlled-stage-diagnosis || "$TASK" = partial-identity ]]
          if [[ "$TASK" = partial-identity ]]; then test "$NOTE" = 52; fi
      - uses: actions/checkout@v7
        with:
          repository: Ajuntanaga/polyphonic-audio-to-midi
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download and verify inputs
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ "$TASK" = controlled-recovery || "$TASK" = controlled-timing-diagnosis || "$TASK" = controlled-stage-diagnosis ]]; then
            export INPUT_TAG=controls-pass2-20261109
            export INPUT_SHA256=692b6bdd8b78fb2193489c6597ca413630c11ab9f3f835569e7f55eacbbf1b3d
          elif [[ "$TASK" = partial-identity ]]; then
            export INPUT_TAG=partial-identity-note52-20261109
            export INPUT_SHA256=4f7efa2ea0ba4d9025ff35c22d2bc48c9a5199a1ebb9b83c422c1bf10038829e
          fi
          mkdir -p "$RUNNER_TEMP/m3-inputs" build/github-results
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --pattern recovery-inputs.tar.gz --dir "$RUNNER_TEMP/m3-inputs"
          printf '%s  %s\n' "$INPUT_SHA256" "$RUNNER_TEMP/m3-inputs/recovery-inputs.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/m3-inputs/recovery-inputs.tar.gz" -C "$RUNNER_TEMP/m3-inputs"
          rm "$RUNNER_TEMP/m3-inputs/recovery-inputs.tar.gz"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          original = Path(os.environ['RUNNER_TEMP']) / 'm3-inputs/recovery-inputs.json'
          manifest = json.loads(original.read_text())
          manifest['source'] = dict(repository='Ajuntanaga/polyphonic-audio-to-midi',
              commit=os.environ['SOURCE_SHA'], provider='github-actions',
              worker_repository=os.environ['GITHUB_REPOSITORY'],
              run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              input_release=os.environ['INPUT_TAG'], input_bundle_sha256=os.environ['INPUT_SHA256'],
              original_input_manifest_sha256=hashlib.sha256(original.read_bytes()).hexdigest())
          Path('build/github-results/runtime-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Build offline replay on GitHub
        if: inputs.task != 'partial-identity'
        working-directory: source
        run: |
          trace=OFF
          stages=OFF
          if [[ "$TASK" = allocation-trace ]]; then trace=ON; fi
          if [[ "$TASK" = controlled-stage-diagnosis ]]; then stages=ON; fi
          cmake -S cloud/native -B build/portable -DCMAKE_BUILD_TYPE=Release -DM3_OFFLINE_ALLOCATION_TRACE="$trace" -DM3_OFFLINE_STAGE_TIMING="$stages" 2>&1 | tee build/github-results/configure.log
          cmake --build build/portable --target m3_replay --parallel 2 2>&1 | tee build/github-results/build.log
      - name: Check bounded allocation recorder
        if: inputs.task == 'allocation-trace'
        working-directory: source
        run: |
          cmake --build build/portable --target m3_allocation_trace_tests --parallel 2 2>&1 | tee build/github-results/recorder-build.log
          ctest --test-dir build/portable -R '^m3_allocation_trace_tests$' --output-on-failure 2>&1 | tee build/github-results/recorder-test.log
      - name: Check diagnosis and comparison contracts
        if: inputs.task != 'partial-identity'
        working-directory: source
        run: |
          python3 -m pip install 'numpy>=2,<3'
          python3 -B -m unittest tests.test_portable_assignment_trace tests.test_selection_trace_diagnosis tests.test_frozen_cue_corpus_gate tests.test_portable_corpus_replay tests.test_portable_allocation_trace tests.test_portable_core_check tests.test_portable_controlled_replay 2>&1 | tee build/github-results/contracts.log
      - name: Screen isolated upper-partial string identity
        if: inputs.task == 'partial-identity'
        working-directory: source
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python3 -m pip install 'numpy>=2,<3' 'scipy>=1.14,<2'
          python3 -B -m unittest tests.test_portable_partial_identity tests.test_harmonic_balance_audit 2>&1 | tee build/github-results/contracts.log
          python3 -B -m tools.portable_partial_identity --corpus "$RUNNER_TEMP/m3-inputs/corpus" --manifest build/github-results/runtime-manifest.json --output build/github-results/partial-identity 2>&1 | tee build/github-results/runner.log
      - name: Check paired core processing without offline observer bookkeeping
        if: inputs.task == 'core-check'
        working-directory: source
        run: |
          python3 -B -m tools.portable_core_check --binary build/portable/m3_replay --corpus "$RUNNER_TEMP/m3-inputs/corpus" --manifest build/github-results/runtime-manifest.json --reference-report docs/recovery/github-core-references-20261109.json --dataset "$DATASET" --output build/github-results/core-check 2>&1 | tee build/github-results/runner.log
      - name: Locate processing allocations
        if: inputs.task == 'allocation-trace'
        working-directory: source
        run: |
          python3 -B -m tools.portable_allocation_trace --binary build/portable/m3_replay --corpus "$RUNNER_TEMP/m3-inputs/corpus" --manifest build/github-results/runtime-manifest.json --reference-report docs/recovery/recovered-corpus-v2-20261109.json --output build/github-results/allocation-trace 2>&1 | tee build/github-results/runner.log
      - name: Diagnose slow blocks without changing acceptance limits
        if: inputs.task == 'timing-diagnosis'
        working-directory: source
        run: |
          python3 -B -m tools.portable_core_check --binary build/portable/m3_replay --corpus "$RUNNER_TEMP/m3-inputs/corpus" --manifest build/github-results/runtime-manifest.json --reference-report docs/recovery/github-core-references-20261109.json --dataset "$DATASET" --output build/github-results/timing-diagnosis --diagnostic-thread-cpu 2>&1 | tee build/github-results/runner.log
      - name: Diagnose string assignment
        if: inputs.task == 'assignment-trace'
        working-directory: source
        run: |
          python3 -B -m tools.portable_assignment_trace --binary build/portable/m3_replay --corpus "$RUNNER_TEMP/m3-inputs/corpus" --manifest build/github-results/runtime-manifest.json --output build/github-results/trace --dataset "$DATASET" --note "$NOTE" 2>&1 | tee build/github-results/runner.log
      - name: Recover OFF and ON corpus references
        if: inputs.task == 'corpus-recovery'
        working-directory: source
        run: |
          python3 -B -m tools.portable_corpus_replay --binary build/portable/m3_replay --corpus "$RUNNER_TEMP/m3-inputs/corpus" --manifest build/github-results/runtime-manifest.json --output build/github-results/corpus --max-seconds 10800 2>&1 | tee build/github-results/runner.log
      - name: Recover and screen held-out overlap controls
        if: inputs.task == 'controlled-recovery'
        working-directory: source
        run: |
          python3 -B -m tools.portable_controlled_replay --binary build/portable/m3_replay --corpus "$RUNNER_TEMP/m3-inputs/corpus" --manifest build/github-results/runtime-manifest.json --reference docs/recovery/heldout-control-reference-20261103.json --output build/github-results/controlled --max-seconds 2400 2>&1 | tee build/github-results/runner.log
      - name: Diagnose the selected octave control timing failure
        if: inputs.task == 'controlled-timing-diagnosis'
        working-directory: source
        run: |
          python3 -B -m tools.portable_controlled_replay --binary build/portable/m3_replay --corpus "$RUNNER_TEMP/m3-inputs/corpus" --manifest build/github-results/runtime-manifest.json --reference docs/recovery/heldout-control-reference-20261103.json --timing-reference-report docs/recovery/github-activity-scan-controls-20261109.json --timing-control "$TIMING_CONTROL" --output build/github-results/controlled-timing --max-seconds 360 2>&1 | tee build/github-results/runner.log
      - name: Isolate processing stage costs in the retained octave pair
        if: inputs.task == 'controlled-stage-diagnosis'
        working-directory: source
        run: |
          python3 -B -m tools.portable_controlled_replay --binary build/portable/m3_replay --corpus "$RUNNER_TEMP/m3-inputs/corpus" --manifest build/github-results/runtime-manifest.json --reference docs/recovery/heldout-control-reference-20261103.json --timing-reference-report docs/recovery/github-activity-scan-controls-20261109.json --timing-control "$TIMING_CONTROL" --require-stage-timing --output build/github-results/controlled-stages --max-seconds 360 2>&1 | tee build/github-results/runner.log
      - name: Keep small reports and failure logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-report-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            source/build/github-results/**/*.json
            source/build/github-results/**/*.log
            source/build/github-results/**/*.stderr
      - name: Keep compressed trace and reference evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          compression-level: 1
          if-no-files-found: warn
          path: |
            source/build/github-results/**/*.tsv
            source/build/github-results/**/*.gz
            source/build/portable/m3_replay
