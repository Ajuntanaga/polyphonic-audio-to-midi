name: Portable offline replay
on:
  workflow_dispatch:
  push:
    branches: [main, 'work/tuner-stability-*']
    paths: ['native/**', 'tools/**', 'cloud/**', 'tests/**', 'CMakeLists.txt', '.github/workflows/offline-replay.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: offline-replay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configure and build diagnostic replay
        run: |
          cmake -S cloud/native -B build/portable -DCMAKE_BUILD_TYPE=Release
          cmake --build build/portable --parallel 2
      - name: Native tests
        run: ctest --test-dir build/portable --output-on-failure
      - name: Replay comparison contracts
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python3 -m pip install 'numpy>=2,<3' 'scipy>=1.14,<2'
          python3 -B -m unittest tests.test_portable_octave_common_estimator tests.test_frozen_cue_corpus_gate tests.test_portable_recovery tests.test_portable_corpus_replay tests.test_midi_lifecycle_analysis tests.test_cloud_bootstrap tests.test_binary_triage tests.test_portable_assignment_trace tests.test_selection_trace_diagnosis tests.test_portable_allocation_trace tests.test_portable_core_check tests.test_portable_controlled_replay tests.test_portable_partial_identity tests.test_portable_evidence_retention_trial tests.test_portable_routing_trace tests.test_portable_midi_lane_trace tests.test_portable_retained_spectral_trial tests.test_portable_retained_spectral_diagnosis tests.test_portable_midi_ledger_replay tests.test_portable_pending_string_trial tests.test_assignment_cost_analysis tests.test_portable_pending_string_trace tests.test_portable_forced_pending_string_trial tests.test_portable_forced_pending_string_trace tests.test_portable_pending_midi_retention_trial tests.test_portable_calibrated_midi_retention_trial tests.test_portable_calibrated_midi_retention_corpus tests.test_portable_calibrated_midi_retention_timing tests.test_portable_completion_midi_retention_timing tests.test_portable_sample_observation_comparison tests.test_portable_three_string_lock_trace tests.test_portable_suppressed_adjacent_admission_trial tests.test_portable_suppressed_adjacent_admission_trace tests.test_portable_qualified_tier_retention_trace tests.test_candidate_outcome_analysis tests.test_portable_completion_window_retention_trace tests.test_partial_motion_evidence tests.test_portable_ordinary_partial_comparison tests.test_portable_ordinary_harmonic_prediction tests.test_harmonic_admission_cues tests.test_harmonic_competition_cues tests.test_harmonic_source_continuity tests.test_portable_ordinary_harmonic_admission tests.test_supported_sustain_screen tests.test_persistent_candidate_screen tests.test_local_onset_assignment_trace tests.test_ordinary_harmonic_attribution tests.test_ordinary_harmonic_competition_attribution tests.test_portable_stable_note_identity_ledger tests.test_portable_vst3_process_timing tests.test_portable_vst3_stable_note_corpus tests.test_vst3_stable_note_corpus_gate tests.test_portable_vst3_stable_note_replay tests.test_portable_vst3_completion_midi_replay tests.test_portable_vst3_corpus_replay tests.test_portable_vst3_recovery_replay
      - name: Synthetic buffer parity smoke check
        run: python3 -B -m tools.portable_replay_smoke --binary build/portable/m3_replay --output build/cloud-smoke
      - name: Keep bounded diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-replay-${{ github.sha }}
          retention-days: 7
          path: |
            build/portable/m3_replay
            build/portable/m3_midi_ledger_replay
            build/portable/Testing/Temporary/LastTest.log
            build/cloud-smoke/*.json
            build/cloud-smoke/*.tsv
